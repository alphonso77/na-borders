<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Borders · North America</title>
    <meta name="description" content="Country, state and province borders of North America. Click a region to see what it is and who it borders." />
    <meta name="theme-color" content="#F4F5F1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <aside class="panel" aria-label="Map controls and details">
        <header class="panel-head">
          <h1 class="brand">Borders</h1>
          <span class="muted small">North America</span>
        </header>

        <div class="search">
          <label for="search" class="field-label">Find a place</label>
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
            <input
              id="search"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Country, state or province"
              role="combobox"
              aria-expanded="false"
              aria-controls="search-results"
              aria-autocomplete="list"
            />
          </div>
          <ul id="search-results" class="search-results" role="listbox" hidden></ul>
        </div>

        <fieldset class="layers">
          <legend class="field-label">Show</legend>
          <div class="segments" role="group" aria-label="Focus on a country">
            <button type="button" data-focus="all" aria-pressed="true">All</button>
            <button type="button" data-focus="CAN" aria-pressed="false">Canada</button>
            <button type="button" data-focus="USA" aria-pressed="false">U.S.</button>
            <button type="button" data-focus="MEX" aria-pressed="false">Mexico</button>
          </div>
          <label class="toggle">
            <input type="checkbox" id="toggle-countries" checked autocomplete="off" />
            <span>Country borders</span>
            <svg width="34" height="6" aria-hidden="true"><line x1="0" y1="3" x2="34" y2="3" class="swatch-country" /></svg>
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-admin1" checked autocomplete="off" />
            <span>States &amp; provinces</span>
            <svg width="34" height="6" aria-hidden="true"><line x1="0" y1="3" x2="34" y2="3" class="swatch-admin1" /></svg>
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-labels" checked autocomplete="off" />
            <span>Place names</span>
          </label>
        </fieldset>

        <section id="details" class="details" aria-live="polite"></section>

        <footer class="credit small muted">
          Boundaries: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>
        </footer>
      </aside>

      <main class="map-wrap">
        <div id="map" role="region" aria-label="Map of North America with country, state and province borders"></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
